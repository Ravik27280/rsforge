<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Wave -->
  <path d="M0 400C100 350 300 450 500 400S700 300 800 350V600H0V400Z" fill="#EEF2FF" />
  
  <!-- Table -->
  <rect x="300" y="350" width="300" height="20" fill="#4F46E5" />
  <rect x="320" y="370" width="10" height="100" fill="#4F46E5" />
  <rect x="570" y="370" width="10" height="100" fill="#4F46E5" />
  
  <!-- Standing Person -->
  <g transform="translate(250,250)">
    <!-- Body -->
    <rect x="0" y="0" width="60" height="120" rx="30" fill="#FB923C" />
    <!-- Head -->
    <circle cx="30" cy="-20" r="25" fill="#FED7AA" />
    <!-- Arms -->
    <rect x="-20" y="20" width="40" height="10" rx="5" fill="#FB923C" transform="rotate(-30)" />
    <rect x="40" y="20" width="40" height="10" rx="5" fill="#FB923C" transform="rotate(30)" />
  </g>
  
  <!-- Sitting Person 1 -->
  <g transform="translate(400,300)">
    <!-- Body -->
    <rect x="0" y="0" width="50" height="80" rx="25" fill="#1D4ED8" />
    <!-- Head -->
    <circle cx="25" cy="-20" r="20" fill="#FED7AA" />
  </g>
  
  <!-- Sitting Person 2 -->
  <g transform="translate(500,300)">
    <!-- Body -->
    <rect x="0" y="0" width="50" height="80" rx="25" fill="#EC4899" />
    <!-- Head -->
    <circle cx="25" cy="-20" r="20" fill="#FED7AA" />
  </g>
  
  <!-- Thought Bubbles -->
  <circle cx="350" cy="150" r="20" fill="#93C5FD" opacity="0.6" />
  <circle cx="450" cy="120" r="25" fill="#F472B6" opacity="0.6" />
  <circle cx="550" cy="140" r="15" fill="#A78BFA" opacity="0.6" />
  
  <!-- Gear Icons -->
  <path d="M500 100A20 20 0 1 1 500 60A20 20 0 0 1 500 100Z" fill="#6366F1" />
  <path d="M500 80L520 80M500 80L480 80M500 60L500 40M500 100L500 120" stroke="#4F46E5" stroke-width="4" />
</svg> 